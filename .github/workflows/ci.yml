name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Site check against local wrangler dev
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
        run: |
          PERSIST="$RUNNER_TEMP/wrangler-state"
          npx wrangler d1 migrations apply labthrift-metrics --local --persist-to "$PERSIST"
          npx wrangler dev --no-bundle --persist-to "$PERSIST" > "$RUNNER_TEMP/wrangler-dev.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8787/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8787/ || { cat "$RUNNER_TEMP/wrangler-dev.log"; exit 1; }
          npm run check
